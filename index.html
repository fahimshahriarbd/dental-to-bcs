```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BDS to BCS — Questions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      line-height: 1.6;
    }

    .container {
      width: min(100% - 30px, 1000px);
      margin: auto;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    .logo span {
      color: #2563eb;
    }

    .hero {
      text-align: center;
      padding: 55px 15px 30px;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin-bottom: 10px;
    }

    .hero p {
      color: #6b7280;
      max-width: 650px;
      margin: auto;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
      margin: 20px auto 30px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    select:focus {
      border-color: #2563eb;
    }

    .question-card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    .question-number {
      font-size: 13px;
      color: #2563eb;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .question {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      padding: 13px 15px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
      background: #fff;
    }

    .option:hover {
      background: #f3f6ff;
      border-color: #2563eb;
    }

    .option.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }

    .option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
    }

    .explanation {
      display: none;
      margin-top: 18px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 10px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 50px;
    }

    footer {
      text-align: center;
      padding: 40px 15px;
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .filter-row {
        grid-template-columns: 1fr;
      }

      .question-card {
        padding: 18px;
      }

      .question {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">
    <div class="logo">
      BDS <span>to</span> BCS
    </div>

    <div>
      Fahim Shahriar
    </div>
  </div>
</header>


<main>

  <section class="hero">
    <div class="container">
      <h1>BDS to BCS</h1>

      <p>
        Practice questions for BDS students and BCS candidates.
        Choose your category and subject to start learning.
      </p>
    </div>
  </section>


  <section class="container">

    <div class="filters">

      <div class="filter-row">

        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="BDS">BDS</option>
          <option value="BCS">BCS</option>
        </select>

        <select id="subjectFilter">
          <option value="all">All Subjects</option>
        </select>

      </div>

    </div>


    <div id="questionContainer">

      <div class="loading">
        Loading questions...
      </div>

    </div>

  </section>

</main>


<footer>
  © 2026 BDS to BCS · Fahim Shahriar
</footer>


<script>

  /*
    =====================================================
    GOOGLE APPS SCRIPT WEB APP URL
    =====================================================
    
    এখানে তোমার Google Apps Script Web App URL বসাবে।
  */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzwEtARZ36HPe6gS6BymvbrDNUVj9MnMWKj4kNOEZATJdmdoe133lzlGtF74l-zoMtU/exec";


  let allQuestions = [];


  /*
    =====================================================
    LOAD QUESTIONS
    =====================================================
  */

  async function loadQuestions() {

    const container =
      document.getElementById("questionContainer");

    try {

      const response = await fetch(API_URL);

      if (!response.ok) {
        throw new Error("Failed to load questions");
      }

      const data = await response.json();

      allQuestions = data;

      updateSubjects();

      displayQuestions();

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          <h3>Unable to load questions</h3>
          <p>
            Please check the Google Apps Script URL.
          </p>
        </div>
      `;
    }
  }


  /*
    =====================================================
    UPDATE SUBJECT FILTER
    =====================================================
  */

  function updateSubjects() {

    const category =
      document.getElementById("categoryFilter").value;

    const subjectFilter =
      document.getElementById("subjectFilter");

    let filtered = allQuestions;

    if (category !== "all") {

      filtered = allQuestions.filter(
        q => q.Category === category
      );

    }

    const subjects = [
      ...new Set(
        filtered
          .map(q => q.Subject)
          .filter(Boolean)
      )
    ];

    subjectFilter.innerHTML =
      `<option value="all">All Subjects</option>`;

    subjects.forEach(subject => {

      const option =
        document.createElement("option");

      option.value = subject;
      option.textContent = subject;

      subjectFilter.appendChild(option);

    });

  }


  /*
    =====================================================
    DISPLAY QUESTIONS
    =====================================================
  */

  function displayQuestions() {

    const container =
      document.getElementById("questionContainer");

    const category =
      document.getElementById("categoryFilter").value;

    const subject =
      document.getElementById("subjectFilter").value;


    let filtered =
      allQuestions;


    if (category !== "all") {

      filtered =
        filtered.filter(
          q => q.Category === category
        );

    }


    if (subject !== "all") {

      filtered =
        filtered.filter(
          q => q.Subject === subject
        );

    }


    if (filtered.length === 0) {

      container.innerHTML = `
        <div class="empty">
          <h3>No questions found</h3>
          <p>
            Try another category or subject.
          </p>
        </div>
      `;

      return;
    }


    container.innerHTML = "";


    filtered.forEach((q, index) => {

      const card =
        document.createElement("div");

      card.className = "question-card";


      card.innerHTML = `

        <div class="question-number">
          ${q.Category || ""} 
          ${q.Subject ? "• " + q.Subject : ""}
          • Question ${index + 1}
        </div>

        <div class="question">
          ${q.Question || ""}
        </div>

        <div class="options">

          <div class="option"
               data-answer="A">
            A. ${q["Option A"] || ""}
          </div>

          <div class="option"
               data-answer="B">
            B. ${q["Option B"] || ""}
          </div>

          <div class="option"
               data-answer="C">
            C. ${q["Option C"] || ""}
          </div>

          <div class="option"
               data-answer="D">
            D. ${q["Option D"] || ""}
          </div>

        </div>

        <div class="explanation">

          <strong>Explanation:</strong><br>

          ${q.Explanation || "No explanation available."}

        </div>
      `;


      const options =
        card.querySelectorAll(".option");

      const explanation =
        card.querySelector(".explanation");


      options.forEach(option => {

        option.addEventListener("click", () => {

          options.forEach(o => {

            o.style.pointerEvents = "none";

          });


          const selected =
            option.dataset.answer;

          const correct =
            String(q.Answer).trim().toUpperCase();


          if (selected === correct) {

            option.classList.add("correct");

          } else {

            option.classList.add("wrong");


            options.forEach(o => {

              if (
                o.dataset.answer === correct
              ) {

                o.classList.add("correct");

              }

            });

          }


          explanation.style.display = "block";

        });

      });


      container.appendChild(card);

    });

  }


  /*
    =====================================================
    FILTER EVENTS
    =====================================================
  */

  document
    .getElementById("categoryFilter")
    .addEventListener("change", () => {

      updateSubjects();

      displayQuestions();

    });


  document
    .getElementById("subjectFilter")
    .addEventListener("change", () => {

      displayQuestions();

    });


  /*
    =====================================================
    START
    =====================================================
  */

  loadQuestions();

</script>

</body>
</html>
```
