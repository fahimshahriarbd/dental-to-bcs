<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDS to BCS</title>
  <meta name="description" content="Practice questions for BDS students and BCS candidates.">
  <meta property="og:title" content="BDS to BCS">
  <meta property="og:description" content="Practice questions for BDS students and BCS candidates.">

  <!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Fluid Animated Aura Blobs -->
  <div class="fluid-background">
    <div class="fluid-orb fluid-orb-1"></div>
    <div class="fluid-orb fluid-orb-2"></div>
    <div class="fluid-orb fluid-orb-3"></div>
  </div>

  <!-- Frosted Glass Navigation Bar -->
  <header>
    <div class="container header-inner">
      <a href="#" class="brand" id="brandLogo">
        <div class="logo-symbol" title="BDS to BCS Study App">
          <!-- Real Dental Tooth Molar SVG Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3C4.8 3 3.5 4.8 3.5 7.2C3.5 10.5 5 12.8 6.2 15.5C7.2 17.8 7.8 21 9.5 21C11 21 11.4 18.2 12 16.5C12.6 18.2 13 21 14.5 21C16.2 21 16.8 17.8 17.8 15.5C19 12.8 20.5 10.5 20.5 7.2C20.5 4.8 19.2 3 17 3C15 3 13.8 4.6 12 4.6C10.2 4.6 9 3 7 3Z"/>
          </svg>
        </div>
        <div class="brand-title">
          <span class="bds">BDS</span>
          <span class="sep">to</span>
          <span class="bcs">BCS</span>
        </div>
      </a>

      <div class="nav-actions">
        <!-- Full Screen Toggle -->
        <button type="button" class="nav-btn" id="btnToggleFullscreen" title="Toggle Full Screen">
          <svg id="fullscreenSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>

        <!-- Sound Toggle -->
        <button type="button" class="nav-btn" id="btnToggleSound" title="Sound On / Off">
          <svg id="soundSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button type="button" class="nav-btn" id="btnToggleTheme" title="Toggle Dark / Light Theme">
          <svg id="themeSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Center Category Switcher: BDS (Dental Tooth) vs BCS (Cadre) -->
    <div class="center-category-hub">
      <div class="category-tabs" role="tablist">
        <!-- BDS Tab with Dental Tooth (Molar) Icon -->
        <button type="button" class="tab-btn active tab-bds" id="tabBtnBds" data-cat="BDS" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3C4.8 3 3.5 4.8 3.5 7.2C3.5 10.5 5 12.8 6.2 15.5C7.2 17.8 7.8 21 9.5 21C11 21 11.4 18.2 12 16.5C12.6 18.2 13 21 14.5 21C16.2 21 16.8 17.8 17.8 15.5C19 12.8 20.5 10.5 20.5 7.2C20.5 4.8 19.2 3 17 3C15 3 13.8 4.6 12 4.6C10.2 4.6 9 3 7 3Z"/>
          </svg>
          BDS (Dental)
        </button>
        <!-- BCS Tab with Cadre Insignia Icon -->
        <button type="button" class="tab-btn tab-bcs" id="tabBtnBcs" data-cat="BCS" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
          BCS (Cadre)
        </button>
      </div>
    </div>

    <!-- Live Practice & Question Count Status Bar -->
    <div class="status-bar">
      <div class="total-questions-indicator">
        <span id="statQuestionCount">Loading questions...</span>
      </div>
      <div id="statStatusBadge" class="badge-live">
        <span class="dot"></span>
        <span>Live Practice</span>
      </div>
    </div>

    <!-- Filter Deck: Subject + Topic + Centered View Questions button (no arrow icon) -->
    <div class="filter-panel">
      <div class="filter-grid">
        <div class="form-group">
          <label class="form-label" for="selectSubject">Subject</label>
          <select id="selectSubject" class="form-select">
            <option value="all">All Subjects</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="selectTopic">Topic</label>
          <select id="selectTopic" class="form-select">
            <option value="all">All Topics</option>
          </select>
        </div>
      </div>

      <div class="filter-action-row">
        <button type="button" class="btn-view-questions" id="btnViewQuestions">
          <span>View Questions</span>
        </button>
      </div>
    </div>

    <!-- Question Counter & Progress Bar Centered Above Flipcard -->
    <div class="card-stage" id="cardStage">
      <!-- Fullscreen Exit Button (Active in Card Fullscreen Zen Mode) -->
      <button type="button" class="btn-exit-fullscreen" id="btnExitFullscreen" title="Exit Card Full Screen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Exit Full Screen</span>
      </button>

      <div class="card-meta-bar">
        <div class="card-counter-center" id="cardCounterIndex">1 / 1</div>
        <div class="progress-container" title="Question Progress">
          <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- 3D Viewport -->
      <div class="card-viewport" id="cardViewport">
        <div class="flip-card-inner" id="flipCardInner">

          <!-- FRONT FACE: Tags at top, Question Centered in middle, Answer button at bottom -->
          <div class="card-face card-front">
            <div class="card-header-tags">
              <span id="frontCategoryLabel">BDS</span>
              <span class="tag-sep">·</span>
              <span id="frontSubjectLabel">Subject</span>
              <span class="tag-sep">·</span>
              <span class="tag-topic" id="frontTopicLabel">Topic</span>
            </div>

            <!-- Question strictly centered horizontally and vertically -->
            <div class="question-container">
              <div class="question-content" id="questionText">
                Loading practice flashcard...
              </div>
            </div>

            <div class="card-front-action">
              <button type="button" class="btn-reveal-answer" id="btnRevealAnswer">
                <span>Answer</span>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- BACK FACE: Centered Answer Only (No description/explanation) -->
          <div class="card-face card-back">
            <div class="card-header-tags">
              <span class="answer-badge-tag">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span>Correct Answer</span>
              </span>
            </div>

            <!-- Answer strictly centered horizontally and vertically -->
            <div class="answer-container">
              <div class="answer-content" id="answerHeadline">
                Answer details
              </div>
            </div>

            <div class="card-back-action">
              <button type="button" class="btn-reveal-answer" id="btnFlipBack">
                ← Question
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- Controls: Only 2 Buttons: Previous & Next -->
      <div class="card-controls">
        <button type="button" class="ctrl-btn" id="btnPrevCard" title="Previous Question">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>Previous</span>
        </button>

        <button type="button" class="ctrl-btn primary" id="btnNextCard" title="Next Question">
          <span>Next</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

    </div>

  </main>

  <!-- Clean Minimal Footer -->
  <footer>
    <div class="container footer-content">
      <p class="copyright">© 2026 All Rights Reserved.</p>
      <p class="credit">Developed by <a href="https://fahimshahriar.com.bd" target="_blank" rel="noopener noreferrer">Fahim Shahriar</a></p>
    </div>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script src="/js/app.js" defer></script>
</body>
</html>
